<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local mediasoup WHIP Viewer</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      video { width: 100%; max-height: 70vh; background: #111; }
      .row { display: flex; gap: .75rem; margin: 1rem 0; flex-wrap: wrap; }
      input { min-width: 22rem; padding: .6rem; }
      button { padding: .6rem 1rem; cursor: pointer; }
      pre { white-space: pre-wrap; background: #f3f3f3; padding: 1rem; min-height: 6rem; }
    </style>
  </head>
  <body>
    <h1>Local mediasoup WHIP Viewer</h1>
    <p>Start the Edge/GStreamer publisher first, then click <strong>Start viewer</strong>.</p>
    <div class="row">
      <input id="streamId" value="Box1_stream" aria-label="Stream ID" />
      <input id="token" value="local-viewer-token" aria-label="Viewer token" />
      <button id="start">Start viewer</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <video id="video" autoplay playsinline muted controls></video>
    <pre id="log"></pre>
    <script type="module" src="/client/viewer.js"></script>
  </body>
</html>
